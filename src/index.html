<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CORE Research Explorer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Search, read and analyse open-access research papers from CORE." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved theme before first paint, so dark mode never flashes white.
      try {
        var t = JSON.parse(localStorage.getItem('cre.theme.v1'));
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>This app needs JavaScript to search CORE.</noscript>
  </body>
</html>
